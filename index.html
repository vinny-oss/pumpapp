<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PumpApp • Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="./app.js"></script>
</head>
<body>
  <!-- SVG icon sprite (inline, no external deps) -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="icon-menu" viewBox="0 0 24 24">
      <path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24">
      <path d="M7 2h2v2h6V2h2v2h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3V2zm15 8H2v10a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V10z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="M9 4l7 8-7 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <path d="M15 4l-7 8 7 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <div class="app">
    <header class="app-header" role="banner">
      <button class="icon-btn" aria-label="Open menu">
        <svg class="icon"><use href="#icon-menu"/></svg>
      </button>

      <h1 class="title">Pump Zone</h1>

      <button class="pill-btn" aria-label="Go Premium">Go Premium</button>
    </header>

    <main id="content" class="content" role="main">
      <section class="container">
        <a class="row-card" href="#" aria-label="Open Today">
          <svg class="icon muted"><use href="#icon-chevron-left"/></svg>
          <span class="row-text">Today</span>
          <svg class="icon muted"><use href="#icon-chevron-right"/></svg>
        </a>

        <section class="card pump-gauge-card">
          <div class="gauge-chips">
            <div class="chip chip-tl">
              <span class="chip-label">H2O</span>
              <span class="chip-value">8/8</span>
            </div>
            <div class="chip chip-tr">
              <span class="chip-label">Pump</span>
              <span class="chip-value">1/1</span>
            </div>
            <div class="chip chip-bl">
              <span class="chip-label">Fuel</span>
              <span class="chip-value">1800</span>
            </div>
            <div class="chip chip-br">
              <span class="chip-label">Rest</span>
              <span class="chip-value">7.5h</span>
            </div>
          </div>

          <div class="gauge-container">
            <div class="gauge" data-value="0.64" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" aria-label="Daily pump progress">
              <div class="gauge-inner">
                <div class="gauge-number">0</div>
                <div class="gauge-label">pumped</div>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
