<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Screen Water Tank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .phone-container {
            position: relative;
            width: 390px;
            height: 844px;
            background: #1a1a1a;
            border-radius: 45px;
            box-shadow:
                0 0 0 12px #2a2a2a,
                0 0 0 14px #1a1a1a,
                0 25px 80px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 30px;
            background: #1a1a1a;
            border-radius: 0 0 20px 20px;
            z-index: 1000;
        }

        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: #f0f8ff;
            overflow: hidden;
        }

        .tank-glass {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            top: 0;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.1) 0%, transparent 10%, transparent 90%, rgba(255,255,255,0.1) 100%),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 0%, transparent 20%);
            pointer-events: none;
            z-index: 150;
        }

        .water-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            overflow: hidden;
            transition: height 10s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .water-container.filling {
            height: 90%;
        }

        .water-body {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(100% + 60px);
            background:
                radial-gradient(ellipse at 30% 30%, rgba(100, 200, 255, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(80, 180, 240, 0.25) 0%, transparent 50%),
                linear-gradient(to bottom,
                    rgba(100, 190, 255, 0.75) 0%,
                    rgba(70, 160, 230, 0.85) 30%,
                    rgba(50, 140, 210, 0.9) 60%,
                    rgba(30, 120, 190, 0.95) 100%);
            filter: url(#water-filter);
        }

        .wavy-edge {
            position: absolute;
            top: -60px;
            left: -10%;
            width: 120%;
            height: 120px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.8s ease-in;
        }

        .water-container.filling .wavy-edge {
            opacity: 1;
        }

        .wavy-edge svg {
            width: 100%;
            height: 100%;
        }

        .water-surface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .water-container.filling .water-surface {
            opacity: 1;
        }

        .surface-layer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 300%;
            height: 100%;
        }

        .foam-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(240,250,255,0.6) 40%, transparent 70%);
            border-radius: 50%;
            animation: float-foam linear infinite;
        }

        @keyframes float-foam {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }
            5% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translate(var(--drift-x), var(--drift-y)) scale(0.3);
                opacity: 0;
            }
        }

        .water-wave {
            position: absolute;
            top: -5px;
            left: 0;
            width: 100%;
            height: 40px;
        }

        .wave-svg {
            position: absolute;
            width: 200%;
            height: 100%;
            left: 0;
        }

        .wave-path {
            animation: wave-move 3s ease-in-out infinite;
        }

        .wave-path:nth-child(2) {
            animation: wave-move 4s ease-in-out infinite reverse;
            opacity: 0.6;
        }

        .wave-path:nth-child(3) {
            animation: wave-move 5s ease-in-out infinite;
            opacity: 0.4;
        }

        @keyframes wave-move {
            0%, 100% {
                d: path("M0,20 Q50,10 100,20 T200,20 T300,20 T400,20 T500,20 T600,20 T700,20 T800,20 L800,50 L0,50 Z");
            }
            50% {
                d: path("M0,10 Q50,20 100,10 T200,10 T300,10 T400,10 T500,10 T600,10 T700,10 T800,10 L800,50 L0,50 Z");
            }
        }

        .real-bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%,
                rgba(255, 255, 255, 0.9) 0%,
                rgba(255, 255, 255, 0.6) 20%,
                rgba(180, 220, 255, 0.4) 45%,
                rgba(100, 180, 255, 0.2) 70%,
                transparent 100%);
            box-shadow:
                inset -2px -2px 4px rgba(255, 255, 255, 0.6),
                inset 2px 2px 4px rgba(0, 100, 200, 0.3);
            animation: bubble-rise linear infinite;
        }

        @keyframes bubble-rise {
            0% {
                bottom: -20px;
                opacity: 0;
                transform: translateX(0) scale(0.5);
            }
            10% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            90% {
                opacity: 0.9;
            }
            100% {
                bottom: 100%;
                opacity: 0;
                transform: translateX(var(--bubble-drift)) scale(var(--bubble-scale));
            }
        }

        .refraction {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 2px,
                    transparent 4px);
            animation: refract 8s ease-in-out infinite;
        }

        @keyframes refract {
            0%, 100% {
                opacity: 0.4;
                transform: translateY(0);
            }
            50% {
                opacity: 0.7;
                transform: translateY(-20px);
            }
        }

        .caustic-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 30%),
                radial-gradient(ellipse at 80% 40%, rgba(255, 255, 255, 0.12) 0%, transparent 35%),
                radial-gradient(ellipse at 40% 70%, rgba(255, 255, 255, 0.1) 0%, transparent 30%),
                radial-gradient(ellipse at 60% 90%, rgba(255, 255, 255, 0.08) 0%, transparent 25%);
            animation: caustic-dance 7s ease-in-out infinite;
            mix-blend-mode: overlay;
        }

        @keyframes caustic-dance {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.5;
            }
            33% {
                transform: translate(10px, -15px) scale(1.1);
                opacity: 0.7;
            }
            66% {
                transform: translate(-10px, -10px) scale(0.95);
                opacity: 0.6;
            }
        }

        .turbulence {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .water-container.filling .turbulence {
            opacity: 1;
            animation: churn 1.5s ease-in-out infinite;
        }

        @keyframes churn {
            0%, 100% {
                transform: translateX(-50%) rotate(0deg) scale(1);
            }
            50% {
                transform: translateX(-50%) rotate(180deg) scale(1.2);
            }
        }

        .churn-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(200, 230, 255, 0.7), transparent);
            border-radius: 50%;
            animation: churn-spread 1s ease-out infinite;
        }

        @keyframes churn-spread {
            0% {
                width: 5px;
                height: 5px;
                top: 50%;
                left: 50%;
                opacity: 1;
            }
            100% {
                width: 40px;
                height: 40px;
                top: 0;
                left: 0;
                opacity: 0;
            }
        }

        .fill-button {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow:
                0 10px 30px rgba(102, 126, 234, 0.4),
                inset 0 -2px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            z-index: 200;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fill-button:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow:
                0 15px 40px rgba(102, 126, 234, 0.6),
                inset 0 -2px 10px rgba(0, 0, 0, 0.2);
        }

        .fill-button:active {
            transform: translateX(-50%) translateY(-1px);
            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.4),
                inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .fill-button.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <filter id="water-filter">
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.03" numOctaves="3" seed="1">
                    <animate attributeName="baseFrequency" dur="20s" values="0.01 0.03;0.02 0.04;0.01 0.03" repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" scale="8"/>
            </filter>
        </defs>
    </svg>

    <div class="phone-container">
        <div class="notch"></div>
        <div class="screen">
            <div class="water-container" id="waterContainer">
                <div class="water-body">
                    <div class="caustic-light"></div>
                    <div class="refraction"></div>
                </div>

                <div class="wavy-edge">
                    <svg viewBox="0 0 390 120" preserveAspectRatio="none">
                        <path d="M0,80 Q30,50 60,70 T120,70 T180,70 T240,70 T300,70 T360,70 L390,70 L390,120 L0,120 Z"
                              fill="rgba(70, 160, 230, 0.9)">
                            <animate attributeName="d" dur="2s" repeatCount="indefinite"
                                values="M0,80 Q30,50 60,70 T120,70 T180,70 T240,70 T300,70 T360,70 L390,70 L390,120 L0,120 Z;
                                        M0,70 Q30,90 60,70 T120,70 T180,70 T240,70 T300,70 T360,70 L390,70 L390,120 L0,120 Z;
                                        M0,75 Q30,60 60,75 T120,75 T180,75 T240,75 T300,75 T360,75 L390,75 L390,120 L0,120 Z;
                                        M0,80 Q30,50 60,70 T120,70 T180,70 T240,70 T300,70 T360,70 L390,70 L390,120 L0,120 Z"/>
                        </path>
                        <path d="M0,70 Q40,45 80,65 T160,65 T240,65 T320,65 L390,65 L390,120 L0,120 Z"
                              fill="rgba(85, 175, 235, 0.85)">
                            <animate attributeName="d" dur="2.3s" repeatCount="indefinite"
                                values="M0,70 Q40,45 80,65 T160,65 T240,65 T320,65 L390,65 L390,120 L0,120 Z;
                                        M0,65 Q40,85 80,65 T160,65 T240,65 T320,65 L390,65 L390,120 L0,120 Z;
                                        M0,68 Q40,52 80,68 T160,68 T240,68 T320,68 L390,68 L390,120 L0,120 Z;
                                        M0,70 Q40,45 80,65 T160,65 T240,65 T320,65 L390,65 L390,120 L0,120 Z"/>
                        </path>
                        <path d="M0,60 Q50,35 100,55 T200,55 T300,55 L390,55 L390,120 L0,120 Z"
                              fill="rgba(100, 190, 255, 0.8)">
                            <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
                                values="M0,60 Q50,35 100,55 T200,55 T300,55 L390,55 L390,120 L0,120 Z;
                                        M0,55 Q50,75 100,55 T200,55 T300,55 L390,55 L390,120 L0,120 Z;
                                        M0,58 Q50,45 100,58 T200,58 T300,58 L390,58 L390,120 L0,120 Z;
                                        M0,60 Q50,35 100,55 T200,55 T300,55 L390,55 L390,120 L0,120 Z"/>
                        </path>
                    </svg>
                </div>

                <div class="water-surface">
                    <div class="water-wave">
                        <svg class="wave-svg" viewBox="0 0 800 50" preserveAspectRatio="none">
                            <path class="wave-path" d="M0,20 Q50,10 100,20 T200,20 T300,20 T400,20 T500,20 T600,20 T700,20 T800,20 L800,50 L0,50 Z"
                                  fill="rgba(150, 210, 255, 0.4)">
                                <animate attributeName="d" dur="3s" repeatCount="indefinite"
                                    values="M0,20 Q50,10 100,20 T200,20 T300,20 T400,20 T500,20 T600,20 T700,20 T800,20 L800,50 L0,50 Z;
                                            M0,10 Q50,20 100,10 T200,10 T300,10 T400,10 T500,10 T600,10 T700,10 T800,10 L800,50 L0,50 Z;
                                            M0,20 Q50,10 100,20 T200,20 T300,20 T400,20 T500,20 T600,20 T700,20 T800,20 L800,50 L0,50 Z"/>
                            </path>
                            <path class="wave-path" d="M0,15 Q60,25 120,15 T240,15 T360,15 T480,15 T600,15 T720,15 T800,15 L800,50 L0,50 Z"
                                  fill="rgba(120, 195, 245, 0.5)">
                                <animate attributeName="d" dur="4s" repeatCount="indefinite"
                                    values="M0,15 Q60,25 120,15 T240,15 T360,15 T480,15 T600,15 T720,15 T800,15 L800,50 L0,50 Z;
                                            M0,25 Q60,15 120,25 T240,25 T360,25 T480,25 T600,25 T720,25 T800,25 L800,50 L0,50 Z;
                                            M0,15 Q60,25 120,15 T240,15 T360,15 T480,15 T600,15 T720,15 T800,15 L800,50 L0,50 Z"/>
                            </path>
                            <path class="wave-path" d="M0,25 Q40,15 80,25 T160,25 T240,25 T320,25 T400,25 T480,25 T560,25 T640,25 T720,25 T800,25 L800,50 L0,50 Z"
                                  fill="rgba(100, 180, 235, 0.6)">
                                <animate attributeName="d" dur="5s" repeatCount="indefinite"
                                    values="M0,25 Q40,15 80,25 T160,25 T240,25 T320,25 T400,25 T480,25 T560,25 T640,25 T720,25 T800,25 L800,50 L0,50 Z;
                                            M0,15 Q40,25 80,15 T160,15 T240,15 T320,15 T400,15 T480,15 T560,15 T640,15 T720,15 T800,15 L800,50 L0,50 Z;
                                            M0,25 Q40,15 80,25 T160,25 T240,25 T320,25 T400,25 T480,25 T560,25 T640,25 T720,25 T800,25 L800,50 L0,50 Z"/>
                            </path>
                        </svg>
                    </div>

                    <div class="turbulence" id="turbulence">
                        <div class="churn-particle" style="animation-delay: 0s;"></div>
                        <div class="churn-particle" style="animation-delay: 0.3s;"></div>
                        <div class="churn-particle" style="animation-delay: 0.6s;"></div>
                        <div class="churn-particle" style="animation-delay: 0.9s;"></div>
                    </div>
                </div>

                <div id="bubblesContainer"></div>
                <div id="foamContainer"></div>
            </div>

            <div class="tank-glass"></div>
            <button class="fill-button" id="fillButton">FILL</button>
        </div>
    </div>

    <script>
        const fillButton = document.getElementById('fillButton');
        const waterContainer = document.getElementById('waterContainer');
        const bubblesContainer = document.getElementById('bubblesContainer');
        const foamContainer = document.getElementById('foamContainer');

        // Create realistic bubbles
        function createBubbles() {
            const bubbleCount = 25;
            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'real-bubble';

                const size = Math.random() * 15 + 5;
                const left = Math.random() * 100;
                const duration = Math.random() * 4 + 3;
                const delay = Math.random() * 5;
                const drift = (Math.random() - 0.5) * 100;
                const scale = Math.random() * 0.5 + 0.3;

                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = left + '%';
                bubble.style.animationDuration = duration + 's';
                bubble.style.animationDelay = delay + 's';
                bubble.style.setProperty('--bubble-drift', drift + 'px');
                bubble.style.setProperty('--bubble-scale', scale);

                bubblesContainer.appendChild(bubble);
            }
        }

        // Create foam particles
        function createFoam() {
            const foamCount = 30;
            for (let i = 0; i < foamCount; i++) {
                const foam = document.createElement('div');
                foam.className = 'foam-particle';

                const size = Math.random() * 8 + 3;
                const left = Math.random() * 100;
                const top = Math.random() * 30;
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 4;
                const driftX = (Math.random() - 0.5) * 80;
                const driftY = (Math.random() - 0.5) * 40;

                foam.style.width = size + 'px';
                foam.style.height = size + 'px';
                foam.style.left = left + '%';
                foam.style.top = top + 'px';
                foam.style.animationDuration = duration + 's';
                foam.style.animationDelay = delay + 's';
                foam.style.setProperty('--drift-x', driftX + 'px');
                foam.style.setProperty('--drift-y', driftY + 'px');

                foamContainer.appendChild(foam);
            }
        }

        createBubbles();
        createFoam();

        fillButton.addEventListener('click', () => {
            waterContainer.classList.add('filling');
            fillButton.classList.add('hidden');
        });

        // Double-click to reset
        waterContainer.addEventListener('dblclick', () => {
            waterContainer.classList.remove('filling');
            fillButton.classList.remove('hidden');
        });
    </script>
</body>
</html>
