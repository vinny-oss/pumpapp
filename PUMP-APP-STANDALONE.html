<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💪 PUMP APP</title>
    <!-- Last updated: 2025-11-05 20:30 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            background: #ffff00;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 20px;
        }

        .app-title {
            font-size: 3rem;
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        .test-message {
            font-size: 1.5rem;
            color: #ff0000;
            font-weight: bold;
            text-align: center;
        }

        .refresh-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .refresh-btn {
            background: #007AFF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            transition: all 0.3s ease;
        }

        .refresh-btn:active {
            transform: scale(0.95);
            background: #0051D5;
        }

        @media (max-width: 768px) {
            .app-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="refresh-container">
        <button class="refresh-btn" onclick="location.reload(true)">🔄 Force Refresh</button>
    </div>
    <h1 class="app-title">PUMP APP</h1>
    <p class="test-message">4 pillars of fitness</p>
</body>
</html>
