<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Silhouette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .phone-container {
            position: relative;
            width: 390px;
            height: 844px;
            background: #1a1a1a;
            border-radius: 45px;
            box-shadow:
                0 0 0 12px #2a2a2a,
                0 0 0 14px #1a1a1a,
                0 25px 80px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 30px;
            background: #1a1a1a;
            border-radius: 0 0 20px 20px;
            z-index: 1000;
        }

        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #2a2a3e 0%, #1a1a2e 100%);
            overflow: hidden;
        }

        .robot-silhouette {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 400px;
            opacity: 0.15;
        }

        .robot-silhouette svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 40px rgba(100, 150, 200, 0.3));
        }

        /* Subtle glow animation */
        @keyframes glow-pulse {
            0%, 100% {
                opacity: 0.15;
                filter: drop-shadow(0 0 40px rgba(100, 150, 200, 0.3));
            }
            50% {
                opacity: 0.25;
                filter: drop-shadow(0 0 60px rgba(100, 150, 200, 0.5));
            }
        }

        .robot-silhouette svg {
            animation: glow-pulse 4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="notch"></div>
        <div class="screen">
            <div class="robot-silhouette">
                <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
                    <!-- Robot Head and Shoulders Silhouette -->
                    <path d="
                        M 150,50
                        L 130,50
                        Q 120,50 120,60
                        L 120,90
                        Q 120,95 115,95
                        L 105,95
                        Q 100,95 100,100
                        L 100,130
                        Q 100,140 110,140
                        L 120,140
                        L 120,160
                        Q 120,170 130,170
                        L 170,170
                        Q 180,170 180,160
                        L 180,140
                        L 190,140
                        Q 200,140 200,130
                        L 200,100
                        Q 200,95 195,95
                        L 185,95
                        Q 180,95 180,90
                        L 180,60
                        Q 180,50 170,50
                        Z

                        M 120,170
                        L 120,180
                        Q 120,190 110,195
                        L 80,210
                        Q 70,215 70,225
                        L 70,280
                        Q 70,290 60,290
                        L 40,290
                        Q 30,290 30,300
                        L 30,350
                        L 130,350
                        L 130,200
                        Q 130,190 120,180
                        Z

                        M 180,170
                        L 180,180
                        Q 180,190 190,195
                        L 220,210
                        Q 230,215 230,225
                        L 230,280
                        Q 230,290 240,290
                        L 260,290
                        Q 270,290 270,300
                        L 270,350
                        L 170,350
                        L 170,200
                        Q 170,190 180,180
                        Z
                    "
                    fill="rgba(100, 150, 200, 0.8)"
                    stroke="none"/>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
