<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN - Tech Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .phone-container {
            position: relative;
            width: 390px;
            height: 844px;
            background: #1a1a1a;
            border-radius: 45px;
            box-shadow:
                0 0 0 12px #2a2a2a,
                0 0 0 14px #1a1a1a,
                0 25px 80px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 30px;
            background: #1a1a1a;
            border-radius: 0 0 20px 20px;
            z-index: 1000;
        }

        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0f1e 100%);
            overflow: hidden;
        }

        .grid-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            animation: grid-scroll 20s linear infinite;
        }

        @keyframes grid-scroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Circuit lines background */
        .circuit {
            position: absolute;
            width: 2px;
            background: linear-gradient(180deg, transparent, #00ffff, transparent);
            opacity: 0.3;
            animation: circuit-flow 3s linear infinite;
        }

        @keyframes circuit-flow {
            0% { height: 0; top: 0; }
            50% { height: 100%; top: 0; }
            100% { height: 0; top: 100%; }
        }

        .circuit:nth-child(1) { left: 10%; animation-delay: 0s; }
        .circuit:nth-child(2) { left: 30%; animation-delay: 1s; }
        .circuit:nth-child(3) { left: 50%; animation-delay: 0.5s; }
        .circuit:nth-child(4) { left: 70%; animation-delay: 1.5s; }
        .circuit:nth-child(5) { left: 90%; animation-delay: 0.8s; }

        /* Glowing orbs floating around */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.4) 0%, transparent 70%);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            animation: float-orb 8s ease-in-out infinite;
        }

        @keyframes float-orb {
            0%, 100% {
                transform: translate(0, 0);
                opacity: 0.4;
            }
            50% {
                transform: translate(var(--drift-x), var(--drift-y));
                opacity: 0.8;
            }
        }

        .orb:nth-child(6) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 15%;
            --drift-x: 30px;
            --drift-y: -40px;
            animation-delay: 0s;
        }

        .orb:nth-child(7) {
            width: 60px;
            height: 60px;
            top: 50%;
            right: 20%;
            --drift-x: -25px;
            --drift-y: 30px;
            animation-delay: 2s;
        }

        .orb:nth-child(8) {
            width: 100px;
            height: 100px;
            bottom: 25%;
            left: 25%;
            --drift-x: 40px;
            --drift-y: -30px;
            animation-delay: 4s;
        }

        /* Particle effects */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 3px #00ffff;
            animation: particle-drift 6s linear infinite;
        }

        @keyframes particle-drift {
            0% {
                opacity: 0;
                transform: translateY(0) translateX(0);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) translateX(var(--particle-drift));
            }
        }

        .particle:nth-child(9) { left: 5%; animation-delay: 0s; --particle-drift: 20px; }
        .particle:nth-child(10) { left: 15%; animation-delay: 1.5s; --particle-drift: -15px; }
        .particle:nth-child(11) { left: 25%; animation-delay: 3s; --particle-drift: 25px; }
        .particle:nth-child(12) { left: 35%; animation-delay: 0.8s; --particle-drift: -20px; }
        .particle:nth-child(13) { left: 45%; animation-delay: 2.2s; --particle-drift: 15px; }
        .particle:nth-child(14) { left: 55%; animation-delay: 1.2s; --particle-drift: -25px; }
        .particle:nth-child(15) { left: 65%; animation-delay: 2.8s; --particle-drift: 18px; }
        .particle:nth-child(16) { left: 75%; animation-delay: 0.5s; --particle-drift: -22px; }
        .particle:nth-child(17) { left: 85%; animation-delay: 1.8s; --particle-drift: 20px; }
        .particle:nth-child(18) { left: 95%; animation-delay: 2.5s; --particle-drift: -18px; }

        /* Scanline effect */
        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            box-shadow: 0 0 10px #00ffff;
            animation: scanline-move 4s linear infinite;
        }

        @keyframes scanline-move {
            0% {
                top: -2px;
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* Hexagon patterns */
        .hex-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background-image:
                repeating-linear-gradient(0deg, #00ffff 0px, #00ffff 1px, transparent 1px, transparent 50px),
                repeating-linear-gradient(60deg, #00ffff 0px, #00ffff 1px, transparent 1px, transparent 50px),
                repeating-linear-gradient(-60deg, #00ffff 0px, #00ffff 1px, transparent 1px, transparent 50px);
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="notch"></div>
        <div class="screen">
            <div class="hex-pattern"></div>
            <div class="grid-bg"></div>

            <div class="circuit"></div>
            <div class="circuit"></div>
            <div class="circuit"></div>
            <div class="circuit"></div>
            <div class="circuit"></div>

            <div class="orb"></div>
            <div class="orb"></div>
            <div class="orb"></div>

            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>

            <div class="scanline"></div>
        </div>
    </div>
</body>
</html>
