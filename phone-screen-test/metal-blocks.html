<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metal Building Blocks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        .phone-container {
            position: relative;
            width: 390px;
            height: 844px;
            background: #1a1a1a;
            border-radius: 45px;
            box-shadow:
                0 0 0 12px #2a2a2a,
                0 0 0 14px #1a1a1a,
                0 25px 80px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 30px;
            background: #1a1a1a;
            border-radius: 0 0 20px 20px;
            z-index: 1000;
        }

        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #2a2a3e 0%, #1a1a2e 50%, #0a0a1e 100%);
            overflow: hidden;
        }

        /* Blueprint grid */
        .blueprint-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(100, 150, 200, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 150, 200, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.3;
        }

        /* Metal block */
        .metal-block {
            position: absolute;
            animation: block-float ease-in-out infinite;
            transform-style: preserve-3d;
        }

        .block-face {
            position: absolute;
            background: linear-gradient(135deg,
                rgba(140, 150, 160, 0.9) 0%,
                rgba(180, 190, 200, 0.95) 30%,
                rgba(220, 230, 240, 1) 50%,
                rgba(180, 190, 200, 0.95) 70%,
                rgba(140, 150, 160, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow:
                inset -2px -2px 8px rgba(0, 0, 0, 0.3),
                inset 2px 2px 8px rgba(255, 255, 255, 0.4),
                0 0 20px rgba(100, 150, 200, 0.3);
        }

        @keyframes block-float {
            0%, 100% {
                transform: translateY(0) rotateX(var(--rot-x, 0deg)) rotateY(var(--rot-y, 0deg));
            }
            50% {
                transform: translateY(-20px) rotateX(var(--rot-x, 0deg)) rotateY(var(--rot-y, 0deg));
            }
        }

        /* Metallic shine sweep */
        .shine-sweep {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg,
                transparent 0%,
                transparent 40%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 60%,
                transparent 100%);
            animation: shine-move 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes shine-move {
            0% {
                transform: translateX(-100%) translateY(-100%);
            }
            100% {
                transform: translateX(100%) translateY(100%);
            }
        }

        /* Spark when blocks connect */
        .spark {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 200, 100, 1);
            border-radius: 50%;
            box-shadow:
                0 0 5px rgba(255, 200, 100, 1),
                0 0 10px rgba(255, 150, 50, 0.8);
            animation: spark-burst ease-out infinite;
        }

        @keyframes spark-burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--spark-x), var(--spark-y)) scale(0);
            }
        }

        /* Welding arc glow */
        .weld-glow {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle,
                rgba(100, 200, 255, 0.8) 0%,
                rgba(50, 150, 255, 0.4) 40%,
                transparent 70%);
            border-radius: 50%;
            filter: blur(10px);
            animation: weld-pulse 1.5s ease-in-out infinite;
        }

        @keyframes weld-pulse {
            0%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* Metal shavings */
        .shaving {
            position: absolute;
            width: 2px;
            height: 8px;
            background: linear-gradient(to bottom,
                rgba(200, 210, 220, 0.9),
                rgba(150, 160, 170, 0.7));
            animation: shaving-fall linear infinite;
        }

        @keyframes shaving-fall {
            0% {
                top: -10px;
                opacity: 0;
                transform: translateX(0) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            100% {
                top: 100%;
                opacity: 0;
                transform: translateX(var(--shaving-drift)) rotate(720deg);
            }
        }

        /* Rivets/bolts */
        .rivet {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle,
                rgba(180, 190, 200, 1) 0%,
                rgba(120, 130, 140, 0.9) 50%,
                rgba(80, 90, 100, 0.8) 100%);
            border-radius: 50%;
            box-shadow:
                inset -1px -1px 2px rgba(0, 0, 0, 0.5),
                inset 1px 1px 2px rgba(255, 255, 255, 0.5),
                0 2px 4px rgba(0, 0, 0, 0.3);
            animation: rivet-ping ease-in-out infinite;
        }

        @keyframes rivet-ping {
            0%, 100% {
                box-shadow:
                    inset -1px -1px 2px rgba(0, 0, 0, 0.5),
                    inset 1px 1px 2px rgba(255, 255, 255, 0.5),
                    0 2px 4px rgba(0, 0, 0, 0.3);
            }
            50% {
                box-shadow:
                    inset -1px -1px 2px rgba(0, 0, 0, 0.5),
                    inset 1px 1px 2px rgba(255, 255, 255, 0.5),
                    0 2px 4px rgba(0, 0, 0, 0.3),
                    0 0 10px rgba(100, 150, 200, 0.6);
            }
        }

        /* Geometric wireframe */
        .wireframe {
            position: absolute;
            border: 1px solid rgba(100, 150, 200, 0.3);
            animation: wireframe-rotate linear infinite;
        }

        @keyframes wireframe-rotate {
            0% {
                transform: rotate(0deg) scale(1);
                opacity: 0.3;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: rotate(360deg) scale(1.1);
                opacity: 0.3;
            }
        }

        /* Impact waves */
        .impact-wave {
            position: absolute;
            border: 2px solid rgba(150, 180, 210, 0.5);
            border-radius: 4px;
            animation: impact-expand ease-out infinite;
        }

        @keyframes impact-expand {
            0% {
                width: 30px;
                height: 30px;
                opacity: 1;
            }
            100% {
                width: 150px;
                height: 150px;
                opacity: 0;
            }
        }

        /* Assembly beam */
        .assembly-beam {
            position: absolute;
            width: 2px;
            background: linear-gradient(to bottom,
                transparent 0%,
                rgba(100, 200, 255, 0.8) 50%,
                transparent 100%);
            box-shadow: 0 0 10px rgba(100, 200, 255, 0.6);
            animation: beam-scan linear infinite;
        }

        @keyframes beam-scan {
            0% {
                left: 0;
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                left: 100%;
                opacity: 0;
            }
        }

        /* Chrome reflection */
        .chrome-reflection {
            position: absolute;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom,
                rgba(255, 255, 255, 0.1) 0%,
                transparent 100%);
            filter: blur(20px);
            animation: chrome-shift 5s ease-in-out infinite;
        }

        @keyframes chrome-shift {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.3;
            }
            50% {
                transform: translateY(20px);
                opacity: 0.6;
            }
        }

        /* Vignette */
        .vignette {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%,
                transparent 0%,
                rgba(0, 0, 0, 0.3) 70%,
                rgba(0, 0, 0, 0.7) 100%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="notch"></div>
        <div class="screen">
            <div class="blueprint-grid"></div>
            <div class="chrome-reflection"></div>

            <div id="blocksContainer"></div>
            <div id="wireframesContainer"></div>
            <div id="rivetsContainer"></div>
            <div id="sparksContainer"></div>
            <div id="weldContainer"></div>
            <div id="shavingsContainer"></div>
            <div id="impactContainer"></div>
            <div id="beamsContainer"></div>

            <div class="vignette"></div>
        </div>
    </div>

    <script>
        // Create metal blocks
        const blocksContainer = document.getElementById('blocksContainer');
        const blockSizes = [
            { w: 60, h: 60 },
            { w: 80, h: 40 },
            { w: 50, h: 70 },
            { w: 70, h: 50 },
            { w: 90, h: 30 }
        ];

        for (let i = 0; i < 8; i++) {
            const block = document.createElement('div');
            block.className = 'metal-block';

            const size = blockSizes[Math.floor(Math.random() * blockSizes.length)];
            const face = document.createElement('div');
            face.className = 'block-face';
            face.style.width = size.w + 'px';
            face.style.height = size.h + 'px';

            const shine = document.createElement('div');
            shine.className = 'shine-sweep';
            shine.style.animationDelay = Math.random() * 3 + 's';
            face.appendChild(shine);

            block.appendChild(face);

            const top = Math.random() * 70 + 10;
            const left = Math.random() * 70 + 10;
            const duration = Math.random() * 3 + 4;
            const delay = Math.random() * 5;

            block.style.top = top + '%';
            block.style.left = left + '%';
            block.style.animationDuration = duration + 's';
            block.style.animationDelay = delay + 's';
            block.style.setProperty('--rot-x', (Math.random() - 0.5) * 20 + 'deg');
            block.style.setProperty('--rot-y', (Math.random() - 0.5) * 20 + 'deg');

            blocksContainer.appendChild(block);
        }

        // Create wireframes
        const wireframesContainer = document.getElementById('wireframesContainer');
        for (let i = 0; i < 5; i++) {
            const wire = document.createElement('div');
            wire.className = 'wireframe';

            const size = Math.random() * 100 + 50;
            const top = Math.random() * 80 + 10;
            const left = Math.random() * 80 + 10;
            const duration = Math.random() * 10 + 10;

            wire.style.width = size + 'px';
            wire.style.height = size + 'px';
            wire.style.top = top + '%';
            wire.style.left = left + '%';
            wire.style.animationDuration = duration + 's';

            wireframesContainer.appendChild(wire);
        }

        // Create rivets
        const rivetsContainer = document.getElementById('rivetsContainer');
        for (let i = 0; i < 20; i++) {
            const rivet = document.createElement('div');
            rivet.className = 'rivet';

            const top = Math.random() * 100;
            const left = Math.random() * 100;
            const duration = Math.random() * 2 + 2;
            const delay = Math.random() * 4;

            rivet.style.top = top + '%';
            rivet.style.left = left + '%';
            rivet.style.animationDuration = duration + 's';
            rivet.style.animationDelay = delay + 's';

            rivetsContainer.appendChild(rivet);
        }

        // Create sparks
        const sparksContainer = document.getElementById('sparksContainer');
        for (let i = 0; i < 25; i++) {
            const spark = document.createElement('div');
            spark.className = 'spark';

            const top = Math.random() * 80 + 10;
            const left = Math.random() * 80 + 10;
            const angle = Math.random() * 360 * Math.PI / 180;
            const distance = Math.random() * 40 + 20;
            const duration = Math.random() * 1 + 0.5;
            const delay = Math.random() * 3;

            spark.style.top = top + '%';
            spark.style.left = left + '%';
            spark.style.animationDuration = duration + 's';
            spark.style.animationDelay = delay + 's';
            spark.style.setProperty('--spark-x', Math.cos(angle) * distance + 'px');
            spark.style.setProperty('--spark-y', Math.sin(angle) * distance + 'px');

            sparksContainer.appendChild(spark);
        }

        // Create weld glows
        const weldContainer = document.getElementById('weldContainer');
        for (let i = 0; i < 6; i++) {
            const weld = document.createElement('div');
            weld.className = 'weld-glow';

            const top = Math.random() * 80 + 10;
            const left = Math.random() * 80 + 10;
            const delay = Math.random() * 3;

            weld.style.top = top + '%';
            weld.style.left = left + '%';
            weld.style.animationDelay = delay + 's';

            weldContainer.appendChild(weld);
        }

        // Create metal shavings
        const shavingsContainer = document.getElementById('shavingsContainer');
        for (let i = 0; i < 15; i++) {
            const shaving = document.createElement('div');
            shaving.className = 'shaving';

            const left = Math.random() * 100;
            const duration = Math.random() * 3 + 2;
            const delay = Math.random() * 4;
            const drift = (Math.random() - 0.5) * 60;

            shaving.style.left = left + '%';
            shaving.style.animationDuration = duration + 's';
            shaving.style.animationDelay = delay + 's';
            shaving.style.setProperty('--shaving-drift', drift + 'px');

            shavingsContainer.appendChild(shaving);
        }

        // Create impact waves
        const impactContainer = document.getElementById('impactContainer');
        for (let i = 0; i < 8; i++) {
            const impact = document.createElement('div');
            impact.className = 'impact-wave';

            const top = Math.random() * 80 + 10;
            const left = Math.random() * 80 + 10;
            const duration = Math.random() * 2 + 1.5;
            const delay = Math.random() * 4;

            impact.style.top = top + '%';
            impact.style.left = left + '%';
            impact.style.animationDuration = duration + 's';
            impact.style.animationDelay = delay + 's';

            impactContainer.appendChild(impact);
        }

        // Create assembly beams
        const beamsContainer = document.getElementById('beamsContainer');
        for (let i = 0; i < 4; i++) {
            const beam = document.createElement('div');
            beam.className = 'assembly-beam';

            const top = Math.random() * 80 + 10;
            const duration = Math.random() * 4 + 3;
            const delay = Math.random() * 5;

            beam.style.top = top + '%';
            beam.style.height = '100%';
            beam.style.animationDuration = duration + 's';
            beam.style.animationDelay = delay + 's';

            beamsContainer.appendChild(beam);
        }
    </script>
</body>
</html>
